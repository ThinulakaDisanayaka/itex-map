  S.add(g);return g}
(function(){var kinds=['car','car','car','bus','car','truck','car'];
  for(var i=0;i<16;i++){var k=kinds[i%kinds.length],o={g:mkVeh(k,CCOL[i%6]),lane:i%2,sp:16+Math.random()*14,x:-288+Math.random()*496};
    o.dir=o.lane?1:-1;o.z=wp(0,o.lane?118:62)[1];o.g.rotation.y=o.dir<0?Math.PI:0;CARS.push(o)}})();
function stepCars(dt){CARS.forEach(function(o){o.x+=o.dir*o.sp*dt;if(o.x<-295)o.x=215;if(o.x>215)o.x=-295;o.g.position.set(o.x,0,o.z)})}
function stepPeople(dt){P_.forEach(function(q,k){
  if(q.d>0){q.d-=dt;pos.set([0,-50,0],k*3);return}
  if(q.w>0){q.w-=dt}else{var t=q.path[q.i],dx=t[0]-q.x,dz=t[1]-q.z,dist=Math.hypot(dx,dz),m=q.sp*dt;
    if(dist<=m){q.x=t[0];q.z=t[1];if(t[2])q.w=t[2];q.i++;if(q.i>=q.path.length){newPath(q);q.d=Math.random()*3}}else{q.x+=dx/dist*m;q.z+=dz/dist*m}}
  pos[k*3]=q.x;pos[k*3+1]=1.2+Math.abs(Math.sin(q.x*.8+q.z*.8))*.3;pos[k*3+2]=q.z});pg.attributes.position.needsUpdate=true}

var tgt=new THREE.Vector3(-44,0,-3),tg2=tgt.clone(),th=-Math.PI*.75,ph=.95,rad=560,thT=th,phT=ph,radT=rad;

var spEl=document.getElementById('sp'),spB=document.getElementById('spb'),infoEl=document.getElementById('info');

function pan(dx,dy){var k=radT*.0016,s=Math.sin(thT),c=Math.cos(thT);tg2.x+=(-c*dx-s*dy)*k;tg2.z+=(s*dx-c*dy)*k}
canvas.addEventListener('pointerdown',function(e){canvas.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY,b:e.button};moved=0;lastD=0;lastC=null});
canvas.addEventListener('pointermove',function(e){var p=ptrs[e.pointerId];if(!p)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  var ids=Object.keys(ptrs);
  if(ids.length>=2&&!walk){var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y),c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if(lastD)radT=Math.max(25,Math.min(900,radT*lastD/d));if(lastC)pan(c.x-lastC.x,c.y-lastC.y);lastD=d;lastC=c;return}
  if(walk){yawT-=dx*.006;pitT=Math.max(-1.2,Math.min(1.2,pitT-dy*.006));return}
  if(p.b===2||e.shiftKey)pan(dx,dy);else{thT-=dx*.006;phT=Math.max(.001,Math.min(1.5,phT-dy*.006))}});
function up(e){delete ptrs[e.pointerId];lastD=0;lastC=null}

  if(moved<6&&ptrs[e.pointerId]&&Object.keys(ptrs).length<2){var r=canvas.getBoundingClientRect(),m=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),rc=new THREE.Raycaster();rc.setFromCamera(m,cam);
    var h=rc.intersectObjects(huts)[0];if(sel)sel.userData.hl.visible=false;
    if(h&&(!walk||h.distance<90)){sel=h.object;sel.userData.hl.visible=true;showStall(sel.userData.ns)}else{sel=null;hideStall()}}
  up(e)});

addEventListener('keydown',function(e){keys[e.code]=true;if(e.code.indexOf('Arrow')===0)e.preventDefault()});addEventListener('keyup',function(e){keys[e.code]=false});addEventListener('blur',function(){keys={}});
function collide(){for(var it=0;it<2;it++)for(var i=0;i<COL.length;i++){var c=COL[i],ax=c[0],az=c[1],dx=c[2]-ax,dz=c[3]-az,l2=dx*dx+dz*dz||1,t=Math.max(0,Math.min(1,((px-ax)*dx+(pz-az)*dz)/l2)),qx=ax+dx*t,qz=az+dz*t,ex=px-qx,ez=pz-qz,d=Math.hypot(ex,ez),m=1+c[4]/2;
  if(d<m){if(d<1e-4){ex=-dz;ez=dx;d=Math.hypot(ex,ez)||1}px=qx+ex/d*m;pz=qz+ez/d*m}}}
function move(dt){var f=0,s=0,tn=0;
  if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;if(keys.KeyD)s+=1;if(keys.KeyA)s-=1;
  if(keys.KeyQ||keys.ArrowLeft)tn+=1;if(keys.KeyE||keys.ArrowRight)tn-=1;
  f-=joy.y;s+=joy.x;var mg=Math.hypot(f,s);if(mg>1){f/=mg;s/=mg}var run=keys.ShiftLeft||keys.ShiftRight?2:1;
  if(walk){yawT+=tn*dt*1.8;var k=1-Math.exp(-dt*10),sy=Math.sin(yaw),cs=Math.cos(yaw),spd=11*run;
    vx+=((-sy*f+cs*s)*spd-vx)*k;vz+=((-cs*f-sy*s)*spd-vz)*k;px+=vx*dt;pz+=vz*dt;collide();
    var bob=Math.hypot(vx,vz)>1?Math.sin(performance.now()*.011)*.12:0;py+=(5.5+gh(px,pz)+bob-py)*(1-Math.exp(-dt*8));
    var kk=1-Math.exp(-dt*16);yaw+=(yawT-yaw)*kk;pit+=(pitT-pit)*kk}
  else{var sp2=radT*.6*run,s0=Math.sin(thT),c0=Math.cos(thT);tg2.x+=(-s0*f+c0*s)*sp2*dt;tg2.z+=(-c0*f-s0*s)*sp2*dt;thT+=tn*dt*1.2}}

  drawMain(ls);drawLogoScreen(SL,ls.t,now);drawLogoScreen(SR,ls.t,now);stepPeople(dt);stepCars(dt);

  move(dt);var ko=1-Math.exp(-dt*9);th+=(thT-th)*ko;ph+=(phT-ph)*ko;rad+=(radT-rad)*ko;tgt.lerp(tg2,ko);
